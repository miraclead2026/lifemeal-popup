<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FREEZE LAB 부스 3D 시뮬레이션 — LIFEMEAL × HDC아이파크몰</title>
<meta name="description" content="2026 LIFEMEAL FREEZE LAB 팝업 부스 3D 시뮬레이션. 회전·확대·존별 보기.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#ffffff; --ink-2:rgba(255,255,255,.86); --ink-3:rgba(255,255,255,.55);
  --line:rgba(255,255,255,.15); --line-2:rgba(255,255,255,.085);
  --paper:#0B0B0B; --paper-2:#111111;
  --navy:#00FFFF; --navy-2:#00C4C4;
  --green:#8EC31F;
  --stage-a:#14181c; --stage-b:#000000;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;font-weight:400;border:none;background:none;color:inherit;cursor:pointer}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── header ───────────────────────────────── */
header{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 22px;border-bottom:1px solid var(--line);background:var(--paper);z-index:5;
}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{font-size:15px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.brand .sub{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.tag{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--navy);
  border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap;
}
.back{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
.back:hover{color:var(--navy);border-color:var(--navy)}

/* ── body ─────────────────────────────────── */
#body{flex:1;min-height:0;display:flex}

/* stage */
#stage{position:relative;flex:1;min-width:0;background:radial-gradient(120% 90% at 50% 8%,#181d22 0%,#0a0d10 52%,#000 100%)}
#gl{display:block;width:100%;height:100%;touch-action:none;outline:none}

#hud-tl{position:absolute;top:14px;left:14px;z-index:3;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.card{
  background:rgba(17,17,17,.74);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.14);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.55);
  pointer-events:auto;
}
#zone-info{padding:12px 14px;min-width:190px;max-width:280px}
#zone-info .ko{font-size:14px;font-weight:500;letter-spacing:-.01em}
#zone-info .en{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.09em;margin-top:3px}
#zone-info .dim{
  font-family:var(--mono);font-size:10.5px;color:var(--ink-2);margin-top:9px;
  padding-top:9px;border-top:1px solid var(--line-2);line-height:1.8;
}
#zone-info .dim b{font-weight:500;color:var(--ink)}

#hud-tr{position:absolute;top:14px;right:14px;z-index:3;display:flex;gap:6px}
.icon{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;
  background:rgba(17,17,17,.74);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px rgba(0,0,0,.55);color:var(--ink-2);
}
.icon:hover{color:var(--navy);border-color:var(--navy)}
.icon[aria-pressed="true"]{background:var(--navy);color:#00201f;border-color:var(--navy)}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

#hud-b{position:absolute;left:0;right:0;bottom:14px;z-index:3;display:flex;justify-content:center;padding:0 14px}
#views{display:flex;gap:2px;padding:4px;border-radius:12px}
#views button{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);
  padding:8px 13px;border-radius:8px;white-space:nowrap;
}
#views button:hover{background:var(--line-2);color:var(--ink)}
#views button[aria-pressed="true"]{background:var(--navy);color:#00201f;font-weight:600}

#hint{
  position:absolute;left:50%;bottom:66px;transform:translateX(-50%);z-index:2;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:rgba(255,255,255,.38);
  white-space:nowrap;transition:opacity .6s;pointer-events:none;
}

/* loader */
#loader{
  position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(120% 90% at 50% 8%,#181d22 0%,#0a0d10 52%,#000 100%);transition:opacity .6s;
}
#loader.done{opacity:0;pointer-events:none}
#loader .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--ink-2)}
#bar{width:180px;height:2px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--navy);transition:width .25s}
#loader .pct{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
#err{display:none;max-width:340px;text-align:center;font-size:12.5px;line-height:1.7;color:var(--ink-2)}

/* sidebar */
#side{
  flex:0 0 268px;border-left:1px solid var(--line);background:var(--paper);
  display:flex;flex-direction:column;overflow-y:auto;
}
.sec{padding:16px 18px;border-bottom:1px solid var(--line-2)}
.sec h2{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:11px}
.zone{
  width:100%;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;
  text-align:left;font-size:12.5px;font-weight:300;color:var(--ink-2);transition:background .12s;
}
.zone:hover{background:var(--line-2);color:var(--ink)}
.zone[aria-pressed="true"]{background:var(--navy);color:#00201f;font-weight:600}
.zone .sw{width:7px;height:7px;border-radius:2px;background:var(--line);flex:0 0 auto}
.zone[aria-pressed="true"] .sw{background:#00201f}
.zone .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zone .c{font-family:var(--mono);font-size:9px;opacity:.55;font-variant-numeric:tabular-nums}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:12px;color:var(--ink-2)}
.row:not(:last-child){border-bottom:1px solid var(--line-2)}
.sw-t{
  position:relative;width:36px;height:20px;border-radius:999px;background:var(--line);flex:0 0 auto;transition:background .18s;
}
.sw-t::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#f2f2f2;box-shadow:0 1px 3px rgba(0,0,0,.5);transition:transform .18s}
button[aria-pressed="true"] .sw-t{background:var(--green)}
.sw-t{background:rgba(255,255,255,.18)}
button[aria-pressed="true"] .sw-t::after{transform:translateX(16px)}
.tog{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:12px;color:var(--ink-2);text-align:left}
.tog:not(:last-child){border-bottom:1px solid var(--line-2)}

.meta{font-family:var(--mono);font-size:10px;line-height:2;color:var(--ink-3)}
.meta b{font-weight:500;color:var(--ink-2)}
.note{font-size:11px;line-height:1.75;color:var(--ink-3)}
.note a{color:var(--navy)}

.act{
  width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-2);
}
.act:hover{border-color:var(--navy);color:var(--navy)}

/* mobile */
#side-toggle{display:none}
@media (max-width:860px){
  header{padding:11px 14px}
  .brand h1{font-size:13.5px}
  .brand .sub,.tag{display:none}
  #body{flex-direction:column}
  #side{
    flex:0 0 auto;border-left:none;border-top:1px solid var(--line);
    max-height:46vh;
  }
  #side.collapsed{display:none}
  #side-toggle{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  #views button{padding:9px 11px;font-size:10px}
  #zone-info{min-width:0;max-width:200px;padding:10px 12px}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <h1>FREEZE LAB 부스 3D 시뮬레이션</h1>
      <span class="sub">LIFEMEAL × HDC아이파크몰 · 용산 4F LIVING PARK</span>
    </div>
    <div class="hdr-right">
      <span class="tag" id="tag-rev">R02</span>
      <button id="side-toggle" type="button">패널</button>
      <a class="back" href="./index.html">← 대시보드</a>
    </div>
  </header>

  <div id="body">
    <div id="stage">
      <canvas id="gl"></canvas>

      <div id="hud-tl">
        <div class="card" id="zone-info">
          <div class="ko" id="zi-ko">전체 부스</div>
          <div class="en" id="zi-en">FULL BOOTH — R02</div>
          <div class="dim" id="zi-dim"></div>
        </div>
      </div>

      <div id="hud-tr">
        <button class="icon" id="btn-spin" type="button" aria-pressed="false" title="자동 회전">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
        </button>
        <button class="icon" id="btn-shot" type="button" title="이미지로 저장">
          <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>
        </button>
        <button class="icon" id="btn-full" type="button" title="전체화면">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
        </button>
      </div>

      <div id="hud-b">
        <div class="card" id="views">
          <button type="button" data-view="iso" aria-pressed="true">사시도</button>
          <button type="button" data-view="front">정면</button>
          <button type="button" data-view="right">우측면</button>
          <button type="button" data-view="left">좌측면</button>
          <button type="button" data-view="top">탑뷰</button>
        </div>
      </div>

      <div id="hint">드래그 회전 · 휠/핀치 확대 · 우클릭(두 손가락) 이동</div>

      <div id="loader">
        <div class="lbl">LOADING BOOTH MODEL</div>
        <div id="bar"><i></i></div>
        <div class="pct" id="pct">0%</div>
        <div id="err"></div>
      </div>
    </div>

    <aside id="side">
      <div class="sec">
        <h2>존별 보기</h2>
        <div id="zones"></div>
      </div>

      <div class="sec">
        <h2>표시 설정</h2>
        <button class="tog" id="tg-ghost" type="button" aria-pressed="true"><span>선택 외 존 흐리게</span><span class="sw-t"></span></button>
        <button class="tog" id="tg-grid"  type="button" aria-pressed="true"><span>1m 격자</span><span class="sw-t"></span></button>
        <button class="tog" id="tg-shadow" type="button" aria-pressed="true"><span>그림자</span><span class="sw-t"></span></button>
      </div>

      <div class="sec">
        <h2>모델 정보</h2>
        <div class="meta" id="meta"></div>
      </div>

      <div class="sec">
        <h2>참고</h2>
        <p class="note">R02 기준. 미확정 항목(시식대 크기, 가벽 500 단차 기준점, 벽체 두께, 입구 쇼케이스 공용부 점유)은 제작 치수로 사용하지 마세요. 상세 치수는 <b>공간별 도면집 PDF</b>를 함께 보세요.</p>
      </div>

      <div class="sec">
        <button class="act" id="btn-reset" type="button">시점 초기화</button>
        <a class="act" href="./booth.glb" download style="display:block;text-align:center;text-decoration:none;margin-top:8px">GLB 모델 내려받기</a>
      </div>
    </aside>
  </div>
</div>

<script type="module">
import { THREE, OrbitControls, GLTFLoader, RoomEnvironment } from './three-bundle.js';

const MODEL = './booth.glb';
const META  = './booth_meta.json';

const canvas = document.getElementById('gl');
const stage  = document.getElementById('stage');

/* ── renderer ─────────────────────────────── */
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, preserveDrawingBuffer:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 400);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.75;
controls.zoomSpeed = 0.9;
controls.panSpeed = 0.8;
controls.minDistance = 0.6;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.499;
controls.autoRotateSpeed = 0.7;

/* ── environment / lights ─────────────────── */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;
scene.environmentIntensity = 1.0;

const hemi = new THREE.HemisphereLight(0xffffff, 0xb9bfc7, 0.45);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff6ea, 1.9);
key.position.set(7, 12, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.02;
const sc = key.shadow.camera;
sc.left=-11; sc.right=11; sc.top=11; sc.bottom=-11; sc.near=0.5; sc.far=45;
scene.add(key);

const fill = new THREE.DirectionalLight(0xe6f0ff, 0.45);
fill.position.set(-8, 6, -7);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.35);
rim.position.set(0, 4, -12);
scene.add(rim);

/* ── ground + grid ────────────────────────── */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(160,160),
  new THREE.MeshStandardMaterial({color:0x0d1114, roughness:0.96, metalness:0.0})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.001;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(60, 60, 0x2e3a42, 0x1d262c);
grid.material.transparent = true;
grid.material.opacity = 0.85;
grid.position.y = -0.002;
scene.add(grid);

/* ── state ────────────────────────────────── */
const ZONES = new Map();          // name -> {node, mats[], box, ko, en}
let META_DATA = null, ROOT = null, CURRENT = '__all__';
let FULLBOX = new THREE.Box3();

/* ── load ─────────────────────────────────── */
const bar = document.querySelector('#bar i'), pct = document.getElementById('pct');
const loader = document.getElementById('loader'), errBox = document.getElementById('err');

fetch(META).then(r=>r.json()).then(m=>{META_DATA=m;}).catch(()=>{});

new GLTFLoader().load(MODEL, gltf=>{
  ROOT = gltf.scene;
  ROOT.traverse(o=>{
    if(!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    o.material = Array.isArray(o.material) ? o.material.map(m=>m.clone()) : o.material.clone();
    const list = Array.isArray(o.material) ? o.material : [o.material];
    list.forEach(m=>{
      if(m.map){ m.map.anisotropy = renderer.capabilities.getMaxAnisotropy(); m.map.needsUpdate = true; }
    });
  });
  scene.add(ROOT);

  ROOT.children.slice().forEach(node=>{
    const mats = [];
    node.traverse(o=>{ if(o.isMesh){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>mats.push(m)); }});
    const box = new THREE.Box3().setFromObject(node);
    const z = (META_DATA && META_DATA.zones && META_DATA.zones[node.name]) || {};
    ZONES.set(node.name, {node, mats, box, ko:z.ko||node.name, en:z.en||node.name, faces:z.tris||0});
  });
  mats_saveDefaults();

  FULLBOX = new THREE.Box3().setFromObject(ROOT);
  buildZoneList();
  fillMeta();
  showZone('__all__');
  setView('iso', false);

  loader.classList.add('done');
  setTimeout(()=>{loader.style.display='none';},700);
  setTimeout(()=>{document.getElementById('hint').style.opacity='0';},6000);
}, ev=>{
  if(ev.lengthComputable){
    const p = Math.round(ev.loaded/ev.total*100);
    bar.style.width = p+'%'; pct.textContent = p+'%';
  }else{
    const p = Math.min(96, Math.round(ev.loaded/3954000*100));
    bar.style.width = p+'%'; pct.textContent = p+'%';
  }
}, err=>{
  document.querySelector('#loader .lbl').textContent = 'LOAD FAILED';
  errBox.style.display='block';
  errBox.textContent = '3D 모델을 불러오지 못했습니다. booth.glb 파일이 이 페이지와 같은 폴더에 있는지 확인해 주세요.';
  console.error(err);
});

/* ── material opacity handling ────────────── */
const DEF = new WeakMap();
function mats_saveDefaults(){
  ZONES.forEach(z=>z.mats.forEach(m=>{
    if(!DEF.has(m)) DEF.set(m,{transparent:m.transparent, opacity:m.opacity, depthWrite:m.depthWrite});
  }));
}
function setGhost(z, on){
  z.mats.forEach(m=>{
    const d = DEF.get(m); if(!d) return;
    if(on){ m.transparent=true; m.opacity=0.055; m.depthWrite=false; }
    else  { m.transparent=d.transparent; m.opacity=d.opacity; m.depthWrite=d.depthWrite; }
    m.needsUpdate = true;
  });
}

/* ── zone UI ──────────────────────────────── */
const ORDER = ['Z00_Entrance','Z06_Product_islands','Z01_Main_product_wall','Z02_Packaging',
               'W02_Central_partition','Z03_Mission','Z04_Tasting_stand','Z04_Counter',
               'Z04_Storage_racks','Z04_Back_wall','Z05_Coat_rack','overall'];
function buildZoneList(){
  const wrap = document.getElementById('zones');
  const mk = (key, ko, count)=>{
    const b = document.createElement('button');
    b.type='button'; b.className='zone'; b.dataset.zone=key;
    b.setAttribute('aria-pressed', key==='__all__' ? 'true':'false');
    b.innerHTML = '<span class="sw"></span><span class="n"></span><span class="c"></span>';
    b.querySelector('.n').textContent = ko;
    b.querySelector('.c').textContent = count;
    b.addEventListener('click', ()=>{ showZone(key); frameZone(key); });
    wrap.appendChild(b);
  };
  let total = 0; ZONES.forEach(z=>total+=z.faces);
  mk('__all__','전체 부스', total);
  const names = [...ZONES.keys()].sort((a,b)=>{
    const ia=ORDER.indexOf(a), ib=ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  names.forEach(n=>mk(n, ZONES.get(n).ko, ZONES.get(n).faces));
}

let ghostMode = true;
function showZone(key){
  CURRENT = key;
  ZONES.forEach((z,name)=>{
    if(key==='__all__'){ z.node.visible = true; setGhost(z,false); }
    else if(name===key){ z.node.visible = true; setGhost(z,false); }
    else { z.node.visible = ghostMode; setGhost(z, true); }
  });
  document.querySelectorAll('.zone').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.zone===key)));
  const ko = document.getElementById('zi-ko'), en = document.getElementById('zi-en'), dim = document.getElementById('zi-dim');
  const box = key==='__all__' ? FULLBOX : ZONES.get(key).box;
  ko.textContent = key==='__all__' ? '전체 부스' : ZONES.get(key).ko;
  en.textContent = key==='__all__' ? 'FULL BOOTH — R02' : ZONES.get(key).en;
  const s = new THREE.Vector3(); box.getSize(s);
  dim.innerHTML =
    'W <b>'+Math.round(s.x*1000).toLocaleString()+'</b> mm<br>'+
    'D <b>'+Math.round(s.z*1000).toLocaleString()+'</b> mm<br>'+
    'H <b>'+Math.round(s.y*1000).toLocaleString()+'</b> mm';
}
function frameZone(key){
  const box = key==='__all__' ? FULLBOX : ZONES.get(key).box;
  fit(box, CURVIEW, true);
}

/* ── camera framing ───────────────────────── */
let CURVIEW = 'iso';
const DIRS = {
  iso:   new THREE.Vector3( 0.78, 0.56,  1.00),
  front: new THREE.Vector3( 0.00, 0.16,  1.00),
  right: new THREE.Vector3( 1.00, 0.16,  0.00),
  left:  new THREE.Vector3(-1.00, 0.16,  0.00),
  top:   new THREE.Vector3( 0.00, 1.00,  0.0001),
};
let anim = null;
const _c = new THREE.Vector3(), _u = new THREE.Vector3(), _r = new THREE.Vector3(), _f = new THREE.Vector3(), _p = new THREE.Vector3();
function fit(box, view, animate){
  const dir = DIRS[view].clone().normalize();
  const center = new THREE.Vector3(); box.getCenter(center);
  // camera basis for this direction
  _f.copy(dir).negate();                                   // forward (look dir)
  _u.set(0,1,0); if(Math.abs(_f.y) > 0.999) _u.set(0,0,-1);
  _r.crossVectors(_f, _u).normalize();
  _u.crossVectors(_r, _f).normalize();
  // project the 8 box corners onto that basis → exact required half-extents
  const mn = box.min, mx = box.max;
  let hx = 0, hy = 0, depth = 0;
  for(let i=0;i<8;i++){
    _c.set(i&1?mx.x:mn.x, i&2?mx.y:mn.y, i&4?mx.z:mn.z).sub(center);
    hx = Math.max(hx, Math.abs(_c.dot(_r)));
    hy = Math.max(hy, Math.abs(_c.dot(_u)));
    depth = Math.max(depth, Math.abs(_c.dot(_f)));
  }
  const vFov = camera.fov * Math.PI/180;
  const hFov = 2*Math.atan(Math.tan(vFov/2)*camera.aspect);
  const pad = (view==='top') ? 1.04 : 1.08;
  const dist = Math.max(hy/Math.tan(vFov/2), hx/Math.tan(hFov/2)) * pad + depth;
  const target = center.clone();
  const pos = center.clone().add(dir.multiplyScalar(dist));
  camera.near = Math.max(0.03, dist*0.008); camera.far = dist*8 + 60; camera.updateProjectionMatrix();
  if(!animate){ camera.position.copy(pos); controls.target.copy(target); controls.update(); return; }
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const t0ms = performance.now(), DUR = 620;
  cancelAnimationFrame(anim);
  const step = ()=>{
    const v = Math.min(1, (performance.now()-t0ms)/DUR);
    const e = v<0.5 ? 4*v*v*v : 1-Math.pow(-2*v+2,3)/2;
    camera.position.lerpVectors(p0, pos, e);
    controls.target.lerpVectors(t0, target, e);
    controls.update();
    if(v<1) anim = requestAnimationFrame(step);
  };
  step();
}
function setView(view, animate=true){
  CURVIEW = view;
  document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.view===view)));
  fit(CURRENT==='__all__' ? FULLBOX : ZONES.get(CURRENT).box, view, animate);
}
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.getElementById('btn-reset').addEventListener('click',()=>{ showZone('__all__'); setView('iso'); });

/* ── toggles ──────────────────────────────── */
const tgGhost = document.getElementById('tg-ghost');
tgGhost.addEventListener('click', ()=>{
  ghostMode = tgGhost.getAttribute('aria-pressed')!=='true';
  tgGhost.setAttribute('aria-pressed', String(ghostMode));
  showZone(CURRENT);
});
const tgGrid = document.getElementById('tg-grid');
tgGrid.addEventListener('click', ()=>{
  const on = tgGrid.getAttribute('aria-pressed')!=='true';
  tgGrid.setAttribute('aria-pressed', String(on));
  grid.visible = on;
});
const tgShadow = document.getElementById('tg-shadow');
tgShadow.addEventListener('click', ()=>{
  const on = tgShadow.getAttribute('aria-pressed')!=='true';
  tgShadow.setAttribute('aria-pressed', String(on));
  renderer.shadowMap.enabled = on;
  scene.traverse(o=>{ if(o.isMesh && o.material) (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true); });
});

const btnSpin = document.getElementById('btn-spin');
btnSpin.addEventListener('click', ()=>{
  const on = btnSpin.getAttribute('aria-pressed')!=='true';
  btnSpin.setAttribute('aria-pressed', String(on));
  controls.autoRotate = on;
});

document.getElementById('btn-shot').addEventListener('click', ()=>{
  const old = renderer.getPixelRatio();
  renderer.setPixelRatio(Math.min(3, (window.devicePixelRatio||1)*2));
  resize(true); renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = 'FREEZE_LAB_'+(CURRENT==='__all__'?'전체':ZONES.get(CURRENT).ko)+'_'+CURVIEW+'.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
  renderer.setPixelRatio(old); resize(true);
});

document.getElementById('btn-full').addEventListener('click', ()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else stage.requestFullscreen && stage.requestFullscreen();
});

const sideToggle = document.getElementById('side-toggle');
sideToggle.addEventListener('click', ()=>{
  document.getElementById('side').classList.toggle('collapsed');
  setTimeout(()=>resize(true), 60);
});

/* ── meta panel ───────────────────────────── */
function fillMeta(){
  const s = new THREE.Vector3(); FULLBOX.getSize(s);
  let tot=0; ZONES.forEach(z=>tot+=z.faces);
  let tri=0; scene.traverse(o=>{ if(o.isMesh && o.geometry && o.geometry.attributes.position) tri += o.geometry.attributes.position.count/3; });
  document.getElementById('meta').innerHTML =
    '리비전 <b>'+((META_DATA&&META_DATA.revision)||'R02')+'</b><br>'+
    '전체 <b>'+Math.round(s.x*1000).toLocaleString()+' × '+Math.round(s.z*1000).toLocaleString()+' × '+Math.round(s.y*1000).toLocaleString()+'</b> mm<br>'+
    '존 <b>'+ZONES.size+'</b>개 · 면 <b>'+tot.toLocaleString()+'</b><br>'+
    '삼각형 <b>'+Math.round(tri).toLocaleString()+'</b><br>'+
    '단위 <b>mm</b> · 마감 <b>RM004 / SUS201</b>';
}

/* ── loop ─────────────────────────────────── */
function resize(force){
  const w = stage.clientWidth, h = stage.clientHeight;
  if(!w || !h) return;
  const need = force || canvas.width !== Math.floor(w*renderer.getPixelRatio()) || canvas.height !== Math.floor(h*renderer.getPixelRatio());
  if(need){
    renderer.setSize(w, h, false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }
}
new ResizeObserver(()=>resize(true)).observe(stage);
window.addEventListener('resize', ()=>resize(true));

renderer.setAnimationLoop(()=>{
  resize(false);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
